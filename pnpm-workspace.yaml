packages:
  - apps/*
  - packages/*

# Ustawienia pnpm żyją tutaj; pnpm 11 nie czyta ich z .npmrc (tam zostaje tylko registry).
autoInstallPeers: false
strictPeerDependencies: true
saveExact: true
engineStrict: true
verifyStoreIntegrity: true

# React i react-dom to peery Prisma Studio wewnątrz prisma CLI; API ich nie używa.
peerDependencyRules:
  ignoreMissing:
    - react
    - react-dom

# Skrypty instalacyjne uruchamiają tylko pakiety Prisma (pobranie schema engine dla CLI).
allowBuilds:
  '@prisma/engines': true
  prisma: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Poprawki podatności w zależnościach przechodnich (pnpm audit); wersje zgodne (minor/patch).
overrides:
  multer: 2.3.0
  qs: 6.16.0
  fast-uri: 3.1.7
  mysql2: 3.24.4
  'nanoid@3': 3.3.18
  'js-yaml@4': 4.3.2

auditConfig:
  ignoreGhsas:
    # deepmerge-ts <8 w Prisma CLI. CLI jest devDependency, ale pnpm kopiuje je do node_modules/.pnpm
    # obrazu jako peer @prisma/client; nie jest linkowane ani ładowane przez API. Poprawka to major.
    - GHSA-ggr8-5vv4-36mx
