name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks skanuje całą historię
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:validate
      - run: pnpm prisma:generate
      - run: pnpm check:deps
      - run: pnpm check:tracked
      - run: pnpm check:compose
      - run: pnpm check:secrets
      - run: pnpm docs:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test:unit
      # Testcontainers używa Dockera runnera bezpośrednio, bez services; shutdown.spec wymaga dist/.
      - run: pnpm test:integration
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm docker:build
      # SBOM CycloneDX z wbudowanego pnpm sbom (narzędzie przypięte przez packageManager).
      - run: pnpm sbom:generate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/homeintelcore.cdx.json
          retention-days: 30
          if-no-files-found: error
