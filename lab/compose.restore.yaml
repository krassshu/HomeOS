name: homeos-m3-restore

services:
  webserver:
    volumes: !override
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ../lab-data/m3-restore/export:/usr/src/paperless/export
      - ../lab-data/m3-restore/consume:/usr/src/paperless/consume

volumes:
  data:
    name: homeos-m3-restore-paperless-data
  media:
    name: homeos-m3-restore-paperless-media
  pgdata:
    name: homeos-m3-restore-paperless-postgres
  redisdata:
    name: homeos-m3-restore-paperless-valkey
  corefixturepgdata:
    name: homeos-m3-restore-core-postgres
  corefixtureassets:
    name: homeos-m3-restore-core-assets
  corevalkeydata:
    name: homeos-m3-restore-core-valkey
